<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="color-scheme" content="light">
  <title>Review &amp; sign</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
  <style>
    :root { --brand: #2f6b4f; --ink: #17201d; --ink2: #4b5653; --ink3: #7d8885; --line: #e4e8e6; --bg: #eef1f0; --sign: #f5b800; --ok: #067647; --bad: #b42318; color-scheme: light; }
    * { box-sizing: border-box; } [hidden] { display: none !important; }
    html, body { margin: 0; } body { font: 15px/1.5 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; padding-bottom: 130px; }
    button, input { font: inherit; color: inherit; } button { cursor: pointer; }
    .top { background: #fff; border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 20; }
    .top img { max-height: 38px; max-width: 160px; } .top b { font-size: 16px; } .top .num { margin-left: auto; color: var(--ink3); font-size: 13px; font-weight: 600; }
    .wrap { max-width: 900px; margin: 0 auto; padding: 16px; }
    .card { background: #fff; border-radius: 14px; border: 1px solid var(--line); padding: 18px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
    h1 { font-size: 21px; margin: 0 0 6px; letter-spacing: -.01em; } .sub { color: var(--ink2); margin: 0; }
    .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-top: 14px; }
    .facts div { background: var(--bg); border-radius: 10px; padding: 10px 12px; } .facts small { display: block; color: var(--ink3); font-size: 12px; font-weight: 600; } .facts b { font-size: 16px; }
    .btn { border: 0; border-radius: 11px; padding: 13px 20px; font-weight: 800; background: var(--brand); color: #fff; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; font-size: 15.5px; }
    .btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); } .btn.sign { background: var(--sign); color: #2b2100; } .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn.block { width: 100%; }
    .pages { display: grid; gap: 14px; margin-top: 16px; }
    .page { position: relative; background: #fff; box-shadow: 0 3px 14px rgba(0,0,0,.12); width: 100%; }
    .page canvas { display: block; width: 100%; height: auto; }
    .layer { position: absolute; inset: 0; }
    .fld { position: absolute; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: clamp(8px, 1.6vw, 12px); font-weight: 800; overflow: hidden; }
    .fld.mine { background: rgba(245,184,0,.28); border: 2px solid var(--sign); color: #6b4f00; cursor: pointer; animation: pulse 2s infinite; }
    .fld.mine.done { background: rgba(6,118,71,.07); border: 1.5px solid rgba(6,118,71,.45); animation: none; color: var(--ok); }
    .fld.mine.optional:not(.done) { background: rgba(245,184,0,.12); border-style: dashed; animation: none; }
    .fld.mine img { max-width: 100%; max-height: 100%; object-fit: contain; object-position: left center; width: 100%; height: 100%; }
    .fld.mine input[type=text] { width: 100%; height: 100%; border: 0; background: transparent; padding: 0 4px; font-size: clamp(9px, 1.7vw, 13px); font-weight: 600; outline: none; }
    .fld.other { border: 1.5px dashed #b9c2bf; color: #9aa4a1; background: rgba(0,0,0,.02); font-weight: 700; }
    .fld.flash { box-shadow: 0 0 0 4px rgba(245,184,0,.6); }
    .fld .tick { font-size: 150%; line-height: 1; }
    @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(245,184,0,.45); } 50% { box-shadow: 0 0 0 5px rgba(245,184,0,0); } }
    .bar { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); z-index: 30; box-shadow: 0 -6px 20px rgba(0,0,0,.06); }
    .bar-in { max-width: 900px; margin: 0 auto; display: grid; gap: 10px; }
    .bar .row { display: flex; gap: 10px; align-items: center; }
    .prog { flex: 1; } .prog small { color: var(--ink2); font-weight: 700; } .prog .pb { height: 7px; background: var(--line); border-radius: 9px; overflow: hidden; margin-top: 4px; } .prog .pb div { height: 100%; background: var(--ok); width: 0; transition: width .3s; }
    .consent { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: var(--ink2); line-height: 1.4; }
    .consent input { width: 22px; height: 22px; flex: none; accent-color: var(--brand); margin-top: 1px; }
    .modal { position: fixed; inset: 0; background: rgba(16,24,22,.55); z-index: 50; display: grid; place-items: end center; }
    @media (min-width: 640px) { .modal { place-items: center; } }
    .sheet { background: #fff; width: min(620px, 100vw); border-radius: 18px 18px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom)); display: grid; gap: 12px; }
    @media (min-width: 640px) { .sheet { border-radius: 18px; } }
    .sheet h2 { margin: 0; font-size: 18px; }
    .tabs { display: flex; gap: 6px; } .tabs button { flex: 1; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 9px; font-weight: 700; color: var(--ink2); } .tabs button.on { background: #e6f0eb; border-color: transparent; color: var(--brand); }
    .pad { position: relative; border: 2px dashed #c8d0cd; border-radius: 12px; background: #fcfdfc; touch-action: none; }
    .pad canvas { display: block; width: 100%; height: 190px; touch-action: none; } .pad.init canvas { height: 150px; }
    .pad .line { position: absolute; left: 7%; right: 7%; bottom: 28%; border-bottom: 1.5px solid #c8d0cd; pointer-events: none; }
    .pad .x { position: absolute; left: 4%; bottom: 29%; color: #b4bdba; font-weight: 800; pointer-events: none; }
    .typed { border: 1px solid #d6dcda; border-radius: 10px; padding: 12px; width: 100%; font-size: 16px; }
    .typed-prev { font-family: "Dancing Script", cursive; font-size: 46px; min-height: 76px; display: flex; align-items: center; padding: 0 12px; border: 2px dashed #c8d0cd; border-radius: 12px; overflow: hidden; white-space: nowrap; }
    .muted { color: var(--ink3); font-size: 13px; } .err { color: var(--bad); font-weight: 600; font-size: 14px; }
    .center { text-align: center; } .big-ok { width: 64px; height: 64px; border-radius: 50%; background: #e7f6ec; color: var(--ok); display: grid; place-items: center; margin: 6px auto 12px; font-size: 32px; }
    .loading { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 50px; color: var(--ink2); font-weight: 600; }
    .spin { width: 20px; height: 20px; border: 3px solid var(--line); border-top-color: var(--brand); border-radius: 50%; animation: spin .8s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="top"><img id="logo" alt="" hidden><b id="co"></b><span class="num" id="num"></span></div>
  <div class="wrap" id="app"><div class="loading"><span class="spin"></span>Loading your contract…</div></div>
  <div class="bar" id="bar" hidden><div class="bar-in">
    <div class="row"><div class="prog"><small id="progT">0 of 0 done</small><div class="pb"><div id="progB"></div></div></div><button class="btn sign" id="next">Start</button></div>
    <label class="consent" id="consentRow" hidden><input type="checkbox" id="consent"><span id="consentT"></span></label>
    <button class="btn block" id="finish" hidden disabled>Finish &amp; sign</button>
    <div class="err" id="err" hidden></div>
  </div></div>
  <script type="module" src="/js/sign.js"></script>
</body>
</html>
